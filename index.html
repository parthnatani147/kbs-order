<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KBS Direct Order</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fast, robust CSV Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 pb-24 text-slate-900 antialiased font-sans">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 bg-slate-900 text-white px-4 py-3 shadow flex justify-between items-center">
    <div>
      <h1 class="font-bold text-base tracking-wide leading-tight">KBS Orders</h1>
      <p class="text-[10px] text-slate-400">Wholesale Order Portal</p>
    </div>
    <span id="cartBadge" class="bg-amber-500 text-black text-xs font-bold px-2 py-0.5 rounded-full">0 pcs</span>
  </header>

  <!-- Search Bar -->
  <div class="p-3 bg-white border-b border-slate-200 sticky top-[53px] z-20 shadow-sm">
    <input type="text" id="searchInput" oninput="render()" placeholder="Search product or item code..." 
      class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:border-slate-800">
  </div>

  <!-- Product Catalog -->
  <div id="productList" class="p-3 space-y-3">
    <p class="text-xs text-slate-500 text-center py-10" id="loadingText">Loading catalog...</p>
  </div>

  <!-- Bottom Checkout Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 shadow-lg flex justify-between items-center z-40">
    <div>
      <span class="text-[11px] text-slate-500 block leading-tight">Total Quantity</span>
      <span class="text-base font-bold text-slate-900"><span id="cartQtyTotal">0</span> pcs</span>
    </div>
    <button onclick="openModal()" class="bg-emerald-700 text-white font-semibold px-6 py-2 rounded-lg text-sm shadow hover:bg-emerald-800 transition">
      Review Order
    </button>
  </div>

  <!-- Order Modal -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm">Review & Confirm Order</h3>
        <button onclick="closeModal()" class="text-slate-400 text-xl font-bold px-2">&times;</button>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="font-semibold text-slate-700 mb-1 block">Firm / Shop Name *</label>
          <input type="text" id="partyName" class="w-full border p-2 rounded" placeholder="e.g., Sharma Sanitary">
        </div>
        <div>
          <label class="font-semibold text-slate-700 mb-1 block">Phone Number *</label>
          <input type="tel" id="partyPhone" class="w-full border p-2 rounded" placeholder="10-digit mobile number">
        </div>
        <div>
          <label class="font-semibold text-slate-700 mb-1 block">Transport / Delivery Notes</label>
          <input type="text" id="orderNotes" class="w-full border p-2 rounded" placeholder="e.g., Apex Cargo / Station Road">
        </div>
      </div>

      <div id="cartSummary" class="border-t border-b py-2 divide-y text-xs text-slate-700 max-h-48 overflow-y-auto"></div>

      <button onclick="sendOrderViaWhatsApp()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold text-sm hover:bg-emerald-700 shadow">
        Forward Order to WhatsApp
      </button>
    </div>
  </div>

  <script>
    // Configured with your exact Sheet CSV endpoint and WhatsApp number
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXkkQ3M24j0kRVc0OKQ7Kiy-Dcix9xFIqrmo8OeCiZPm9bdqpEoCxh8AtHfxnW5CJHRb3_ai58SH3H/pub?output=csv";
    const WHATSAPP_PHONE = "917718861024";

    let catalog = [];
    let cart = {}; 

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    async function loadCatalog() {
      try {
        const cacheBustUrl = SHEET_CSV_URL + '&t=' + Date.now();
        
        Papa.parse(cacheBustUrl, {
          download: true,
          header: true,
          skipEmptyLines: true,
          transformHeader: function(h) {
            return h.trim().toLowerCase().replace(/['"]/g, '');
          },
          complete: function(results) {
            catalog = results.data.filter(row => row.id || row.name).map(row => {
              let sizesArray = ["Regular"];
              if (row.sizes && row.sizes.trim()) {
                sizesArray = row.sizes.split(',').map(s => s.trim()).filter(Boolean);
              }
              return {
                id: row.id ? row.id.trim() : "",
                name: row.name ? row.name.trim() : "Item",
                sizes: sizesArray,
                image: row.image ? row.image.trim() : ""
              };
            });

            if (!catalog.length) {
              document.getElementById("productList").innerHTML = `
                <p class="text-xs text-slate-500 text-center py-10">No items found in your Google Sheet.</p>
              `;
              return;
            }

            render();
          },
          error: function(err) {
            throw new Error("CSV error: " + err.message);
          }
        });

      } catch (err) {
        console.error(err);
        document.getElementById("productList").innerHTML = `
          <div class="p-4 text-center">
            <p class="text-xs text-red-500 font-medium">Unable to load catalog: ${err.message}</p>
          </div>
        `;
      }
    }

    function render() {
      const searchEl = document.getElementById("searchInput");
      const q = searchEl ? searchEl.value.trim().toLowerCase() : "";
      const list = document.getElementById("productList");
      
      const filtered = catalog.filter(p => {
        const nameMatch = p.name ? p.name.toLowerCase().includes(q) : false;
        const idMatch = p.id ? p.id.toLowerCase().includes(q) : false;
        return !q || nameMatch || idMatch;
      });

      if (!filtered.length) {
        list.innerHTML = `<p class="text-xs text-slate-400 text-center py-10">No matching items found.</p>`;
        return;
      }

      list.innerHTML = filtered.map((product, pIdx) => {
        const imgUrl = (product.image && product.image.trim()) 
          ? product.image.trim() 
          : 'https://placehold.co/120x120/png?text=KBS';

        return `
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col space-y-2.5">
            <div class="flex items-center space-x-3">
              <img src="${imgUrl}" loading="lazy" class="w-16 h-16 object-cover rounded-lg border border-slate-100 flex-shrink-0" alt="${product.name}">
              <div class="flex-1 min-w-0">
                <span class="text-[10px] font-bold text-slate-400">${product.id}</span>
                <h4 class="text-xs font-semibold text-slate-800 leading-snug line-clamp-2">${product.name}</h4>
              </div>
            </div>

            <!-- Sizes & Quantity -->
            <div class="border-t border-slate-100 pt-2 space-y-1.5">
              ${product.sizes.map((size) => {
                const key = `${product.id \vert{}\vert{} pIdx}_${size}`;
                const qty = cart[key]?.qty || 0;
                return `
                  <div class="flex items-center justify-between bg-slate-50 px-2.5 py-1.5 rounded-lg text-xs">
                    <span class="font-medium text-slate-700">${size}</span>
                    <div class="flex items-center space-x-2">
                      <button onclick="changeQty(${pIdx}, '${encodeURIComponent(size)}', -1)" class="w-7 h-7 flex items-center justify-center bg-white border border-slate-300 rounded font-bold text-slate-600 active:bg-slate-200">-</button>
                      <span class="w-5 text-center font-bold text-slate-800">${qty}</span>
                      <button onclick="changeQty(${pIdx}, '${encodeURIComponent(size)}', 1)" class="w-7 h-7 flex items-center justify-center bg-slate-900 rounded font-bold text-white active:bg-black">+</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(productIndex, encodedSize, delta) {
      const p = catalog[productIndex];
      const size = decodeURIComponent(encodedSize);
      if (!p) return;

      const key = `${p.id || productIndex}_${size}`;

      if (!cart[key]) {
        if (delta > 0) cart[key] = { id: p.id, name: p.name, size: size, qty: 1 };
      } else {
        cart[key].qty += delta;
        if (cart[key].qty <= 0) delete cart[key];
      }
      updateCartTotals();
      render();
    }

    function updateCartTotals() {
      let totalPcs = 0;
      Object.values(cart).forEach(item => totalPcs += item.qty);
      document.getElementById("cartBadge").innerText = `${totalPcs} pcs`;
      document.getElementById("cartQtyTotal").innerText = totalPcs;
    }

    function openModal() {
      if (Object.keys(cart).length === 0) return alert("Your cart is empty!");
      const list = document.getElementById("cartSummary");
      list.innerHTML = Object.values(cart).map(i => `
        <div class="py-2 flex justify-between items-center">
          <div>
            <div class="font-medium text-slate-800">${i.name}</div>
            <div class="text-[11px] text-slate-500">Size: ${i.size}</div>
          </div>
          <div class="font-bold text-slate-900 bg-slate-100 px-2.5 py-1 rounded text-xs">${i.qty} pcs</div>
        </div>
      `).join('');
      document.getElementById("checkoutModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("checkoutModal").classList.add("hidden");
    }

    function sendOrderViaWhatsApp() {
      const party = document.getElementById("partyName").value.trim();
      const phone = document.getElementById("partyPhone").value.trim();
      const notes = document.getElementById("orderNotes").value.trim();

      if (!party || !phone) {
        return alert("Please enter shop name and mobile number.");
      }

      let totalPcs = 0;
      let msg = `📦 *NEW ORDER - KBS PORTAL*\n`;
      msg += `--------------------------------\n`;
      msg += `*Party:* ${party}\n`;
      msg += `*Phone:* ${phone}\n`;
      if (notes) msg += `*Transport/Notes:* ${notes}\n`;
      msg += `--------------------------------\n`;
      msg += `*ORDER REQUIREMENT:*\n\n`;

      Object.values(cart).forEach((item, idx) => {
        totalPcs += item.qty;
        msg += `${idx + 1}. *${item.name}*\n`;
        msg += `   ↳ Size: ${item.size} | *Qty: ${item.qty} pcs*\n`;
      });

      msg += `--------------------------------\n`;
      msg += `*Total Unique Items:* ${Object.keys(cart).length}\n`;
      msg += `*Total Quantity:* ${totalPcs} pcs\n`;
      msg += `--------------------------------`;

      const url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
      window.location.href = url;
    }

    loadCatalog();
  </script>
</body>
</html>
