<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KBS Orders</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 pb-28 text-slate-900 antialiased font-sans">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 bg-slate-900 text-white px-4 py-3 shadow flex justify-between items-center">
    <div>
      <h1 class="font-bold text-base tracking-wide leading-tight">KBS Orders</h1>
      <p class="text-[10px] text-slate-400">Direct Wholesale Order</p>
    </div>
    <span id="cartBadge" class="bg-amber-500 text-black text-xs font-bold px-2 py-0.5 rounded-full">0 pcs</span>
  </header>

  <!-- Search Bar -->
  <div class="p-3 bg-white border-b border-slate-200 sticky top-[53px] z-20 shadow-sm">
    <input type="text" id="searchInput" oninput="render()" placeholder="Search items or codes..." 
      class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs outline-none focus:border-slate-800">
  </div>

  <!-- Category Horizontal Chips (Like Blinkit/Zepto) -->
  <div id="categoryBar" class="bg-white border-b border-slate-200 px-3 py-2 flex space-x-2 overflow-x-auto no-scrollbar sticky top-[106px] z-10">
    <button class="text-xs px-3 py-1 rounded-full bg-slate-900 text-white font-medium whitespace-nowrap">All</button>
  </div>

  <!-- Product Grid: 2 Columns on Mobile, 3-4 on Tablet/Desktop -->
  <div class="p-3">
    <div id="productGrid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">
      <p class="col-span-full text-xs text-slate-400 text-center py-10">Loading products...</p>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 shadow-lg flex justify-between items-center z-40">
    <div>
      <span class="text-[10px] text-slate-500 block leading-tight">Total Quantity</span>
      <span class="text-sm font-bold text-slate-900"><span id="cartQtyTotal">0</span> pcs</span>
    </div>
    <button onclick="openModal()" class="bg-emerald-700 text-white font-semibold px-5 py-2 rounded-lg text-xs shadow hover:bg-emerald-800 transition">
      Review Order
    </button>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm">Review & Confirm Order</h3>
        <button onclick="closeModal()" class="text-slate-400 text-xl font-bold px-2">&times;</button>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="font-semibold text-slate-700 mb-1 block">Firm / Shop Name *</label>
          <input type="text" id="partyName" class="w-full border p-2 rounded" placeholder="e.g., Sharma Sanitary">
        </div>
        <div>
          <label class="font-semibold text-slate-700 mb-1 block">Phone Number *</label>
          <input type="tel" id="partyPhone" class="w-full border p-2 rounded" placeholder="10-digit mobile number">
        </div>
        <div>
          <label class="font-semibold text-slate-700 mb-1 block">Transport / Delivery Notes</label>
          <input type="text" id="orderNotes" class="w-full border p-2 rounded" placeholder="e.g., Apex Cargo / Station Road">
        </div>
      </div>

      <div id="cartSummary" class="border-t border-b py-2 divide-y text-xs text-slate-700 max-h-48 overflow-y-auto"></div>

      <button onclick="sendOrderViaWhatsApp()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold text-sm hover:bg-emerald-700 shadow">
        Forward Order to WhatsApp
      </button>
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXkkQ3M24j0kRVc0OKQ7Kiy-Dcix9xFIqrmo8OeCiZPm9bdqpEoCxh8AtHfxnW5CJHRb3_ai58SH3H/pub?output=csv";
    const WHATSAPP_NUM = "917718861024";

    let catalog = [];
    let categories = ["All"];
    let activeCategory = "All";
    let selectedSizes = {}; // { productIdx: chosenSizeString }
    let cart = {};          // { "ID_Size": { id, name, size, qty } }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // CSV Parser supporting columns: id, category, name, sizes, image
    function parseCSV(text) {
      let lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      lines = lines.filter(l => l.trim().length > 0);
      if (lines.length < 2) return [];

      const tokenize = (line) => {
        let entries = [];
        let cur = '';
        let inside = false;
        for (let i = 0; i < line.length; i++) {
          let ch = line[i];
          if (ch === '"') {
            inside = !inside;
          } else if (ch === ',' && !inside) {
            entries.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        entries.push(cur.trim());
        return entries;
      };

      const headers = tokenize(lines[0]).map(h => h.toLowerCase().replace(/['"]/g, '').trim());
      const idIdx = headers.indexOf('id');
      const catIdx = headers.indexOf('category');
      const nameIdx = headers.indexOf('name');
      const sizesIdx = headers.indexOf('sizes');
      const imgIdx = headers.indexOf('image');

      let parsed = [];
      let catSet = new Set(["All"]);

      for (let i = 1; i < lines.length; i++) {
        let row = tokenize(lines[i]);
        let id = idIdx !== -1 && row[idIdx] ? row[idIdx].replace(/['"]/g, '').trim() : '';
        let cat = catIdx !== -1 && row[catIdx] ? row[catIdx].replace(/['"]/g, '').trim() : 'General';
        let name = nameIdx !== -1 && row[nameIdx] ? row[nameIdx].replace(/['"]/g, '').trim() : '';
        let rawSizes = sizesIdx !== -1 && row[sizesIdx] ? row[sizesIdx].replace(/['"]/g, '').trim() : '';
        let img = imgIdx !== -1 && row[imgIdx] ? row[imgIdx].replace(/['"]/g, '').trim() : '';

        if (!id && !name) continue;

        let sizes = rawSizes ? rawSizes.split(',').map(s => s.trim()).filter(Boolean) : ["Regular"];
        if (cat) catSet.add(cat);

        parsed.push({
          id: id || `KBS-${i}`,
          category: cat || "General",
          name: name || id,
          sizes: sizes,
          image: img
        });
      }

      categories = Array.from(catSet);
      return parsed;
    }

    async function loadCatalog() {
      try {
        const fetchUrl = CSV_URL + '&t=' + Date.now();
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error("Status: " + res.status);
        const text = await res.text();
        catalog = parseCSV(text);

        // Pre-select first size for every item
        catalog.forEach((item, idx) => {
          selectedSizes[idx] = item.sizes[0] || "Regular";
        });

        renderCategories();
        render();
      } catch (e) {
        document.getElementById("productGrid").innerHTML = 
          `<p class="col-span-full text-xs text-red-500 text-center py-10">Error loading catalog: ${e.message}</p>`;
      }
    }

    function renderCategories() {
      const bar = document.getElementById("categoryBar");
      bar.innerHTML = categories.map(c => `
        <button onclick="setCategory('${c.replace(/'/g, "\\'")}')" 
          class="text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap transition ${activeCategory === c ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          ${c}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      render();
    }

    function render() {
      const searchEl = document.getElementById("searchInput");
      const q = searchEl ? searchEl.value.trim().toLowerCase() : "";
      const grid = document.getElementById("productGrid");

      const filtered = catalog.filter((item) => {
        const matchesCat = activeCategory === "All" || item.category === activeCategory;
        const matchesSearch = !q || item.name.toLowerCase().includes(q) || item.id.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      if (!filtered.length) {
        grid.innerHTML = '<p class="col-span-full text-xs text-slate-400 text-center py-10">No products found.</p>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const pIdx = catalog.indexOf(item);
        const curSize = selectedSizes[pIdx] || item.sizes[0] || "Regular";
        const key = `${item.id}_${curSize}`;
        const qty = cart[key]?.qty || 0;
        const imgUrl = item.image ? item.image : 'https://placehold.co/300x300/png?text=KBS';

        return `
          <div class="bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col justify-between shadow-sm">
            <!-- Product Image -->
            <div class="relative w-full pb-[85%] bg-slate-100">
              <img src="${imgUrl}" loading="lazy" class="absolute inset-0 w-full h-full object-contain p-2" alt="${item.name}">
              <span class="absolute top-1.5 left-1.5 bg-slate-900/70 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                ${item.id}
              </span>
            </div>

            <!-- Details -->
            <div class="p-2.5 flex-1 flex flex-col justify-between space-y-2">
              <div>
                <h4 class="text-xs font-semibold text-slate-800 leading-snug line-clamp-2 h-8" title="${item.name}">
                  ${item.name}
                </h4>
              </div>

              <!-- Size Dropdown/Pill -->
              <div>
                ${item.sizes.length > 1 ? `
                  <select onchange="selectSize(${pIdx}, this.value)" class="w-full bg-slate-50 border border-slate-200 text-[11px] font-medium text-slate-700 py-1 px-1.5 rounded outline-none">
                    ${item.sizes.map(s => `<option value="${s}" ${s === curSize ? 'selected' : ''}>${s}</option>`).join('')}
                  </select>
                ` : `
                  <span class="inline-block bg-slate-50 border border-slate-100 text-[10px] font-medium text-slate-500 px-2 py-0.5 rounded">
                    ${curSize}
                  </span>
                `}
              </div>

              <!-- Add to Cart or Quantity Selector -->
              <div class="pt-1">
                ${qty === 0 ? `
                  <button onclick="changeQty(${pIdx}, 1)" class="w-full py-1.5 bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 text-xs font-bold rounded-lg transition uppercase tracking-wider">
                    ADD
                  </button>
                ` : `
                  <div class="flex items-center justify-between bg-slate-900 text-white rounded-lg px-2 py-1">
                    <button onclick="changeQty(${pIdx}, -1)" class="w-6 h-6 flex items-center justify-center font-bold active:text-amber-400 text-sm">-</button>
                    <span class="text-xs font-bold">${qty}</span>
                    <button onclick="changeQty(${pIdx}, 1)" class="w-6 h-6 flex items-center justify-center font-bold active:text-amber-400 text-sm">+</button>
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectSize(pIdx, newSize) {
      selectedSizes[pIdx] = newSize;
      render();
    }

    function changeQty(pIdx, delta) {
      const item = catalog[pIdx];
      const size = selectedSizes[pIdx] || item.sizes[0] || "Regular";
      const key = `${item.id}_${size}`;

      if (!cart[key]) {
        if (delta > 0) cart[key] = { id: item.id, name: item.name, size: size, qty: 1 };
      } else {
        cart[key].qty += delta;
        if (cart[key].qty <= 0) delete cart[key];
      }

      updateCartTotals();
      render();
    }

    function updateCartTotals() {
      let totalPcs = 0;
      Object.values(cart).forEach(i => totalPcs += i.qty);
      document.getElementById("cartBadge").innerText = `${totalPcs} pcs`;
      document.getElementById("cartQtyTotal").innerText = totalPcs;
    }

    function openModal() {
      if (Object.keys(cart).length === 0) return alert("Your cart is empty!");
      const list = document.getElementById("cartSummary");
      list.innerHTML = Object.values(cart).map(i => `
        <div class="py-2 flex justify-between items-center">
          <div>
            <div class="font-medium text-slate-800">${i.name}</div>
            <div class="text-[11px] text-slate-500">Size: ${i.size}</div>
          </div>
          <div class="font-bold text-slate-900 bg-slate-100 px-2.5 py-1 rounded text-xs">${i.qty} pcs</div>
        </div>
      `).join('');
      document.getElementById("checkoutModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("checkoutModal").classList.add("hidden");
    }

    function sendOrderViaWhatsApp() {
      const party = document.getElementById("partyName").value.trim();
      const phone = document.getElementById("partyPhone").value.trim();
      const notes = document.getElementById("orderNotes").value.trim();

      if (!party || !phone) {
        return alert("Please enter shop name and mobile number.");
      }

      let totalPcs = 0;
      let msg = `📦 *NEW ORDER - KBS PORTAL*\n`;
      msg += `--------------------------------\n`;
      msg += `*Party:* ${party}\n`;
      msg += `*Phone:* ${phone}\n`;
      if (notes) msg += `*Transport/Notes:* ${notes}\n`;
      msg += `--------------------------------\n`;
      msg += `*ORDER REQUIREMENT:*\n\n`;

      Object.values(cart).forEach((item, idx) => {
        totalPcs += item.qty;
        msg += `${idx + 1}. *${item.name}*\n`;
        msg += `   ↳ Size: ${item.size} | *Qty: ${item.qty} pcs*\n`;
      });

      msg += `--------------------------------\n`;
      msg += `*Total Unique Items:* ${Object.keys(cart).length}\n`;
      msg += `*Total Quantity:* ${totalPcs} pcs\n`;
      msg += `--------------------------------`;

      window.location.href = `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(msg)}`;
    }

    loadCatalog();
  </script>
</body>
</html>
