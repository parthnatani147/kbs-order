<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KBS B2B Order Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #108435;
      --primary-light: #e8f5e9;
      --accent-blue: #0c831f;
      --navy: #1f2937;
      --bg: #f5f7f9;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text-muted: #6b7280;
      --text-main: #111827;
      --radius: 12px;
      --shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }
    .brand-title { font-size: 17px; font-weight: 800; color: #0b5c25; white-space: nowrap; }
    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f1f4f6;
      border-radius: 10px;
      padding: 7px 12px;
      gap: 8px;
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 14px;
    }

    /* Main Layout */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Category Sidebar */
    aside.sidebar {
      width: 88px;
      background: #fff;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding-bottom: 90px;
    }
    .cat-item {
      padding: 12px 6px;
      text-align: center;
      border-bottom: 1px solid #f3f4f6;
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      line-height: 1.25;
      transition: all 0.15s ease;
    }
    .cat-item.active {
      background: #f0fdf4;
      color: var(--primary);
      border-left: 3.5px solid var(--primary);
      font-weight: 700;
    }
    .cat-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #6b7280;
    }
    .cat-item.active .cat-icon-circle {
      background: #dcfce7;
      color: var(--primary);
    }

    /* Products View */
    main.products-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 100px;
    }
    .category-header-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #1f2937;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 768px) {
      aside.sidebar { width: 120px; }
      .cat-item { font-size: 12px; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f9fafb;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: transform 0.2s ease;
    }
    .item-material {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .item-name {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      line-height: 1.25;
      margin: 2px 0 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 32px;
    }

    /* Variants Pill Selector */
    .variant-selector-wrap {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .variant-selector-wrap::-webkit-scrollbar { display: none; }
    .variant-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #4b5563;
      border: 1px solid #e5e7eb;
      white-space: nowrap;
      cursor: pointer;
    }
    .variant-chip.selected {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      font-weight: 700;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .price-box {
      display: flex;
      flex-direction: column;
    }
    .rate {
      font-size: 14px;
      font-weight: 800;
      color: #111827;
    }
    .item-code {
      font-size: 10px;
      color: #9ca3af;
      font-weight: 600;
    }

    /* Action Add/Counter */
    .btn-add {
      background: #fff;
      border: 1px solid var(--primary);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-add:active { background: var(--primary-light); }
    .qty-counter {
      display: flex;
      align-items: center;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      overflow: hidden;
      font-weight: 700;
      font-size: 13px;
    }
    .qty-counter button {
      background: transparent;
      border: none;
      color: #fff;
      padding: 5px 9px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }
    .qty-val { min-width: 18px; text-align: center; }

    /* Floating Cart Bar */
    .cart-float-bar {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: #027a48;
      color: white;
      border-radius: 14px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(2, 122, 72, 0.35);
      cursor: pointer;
      z-index: 50;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .cart-summary-txt { display: flex; flex-direction: column; }
    .cart-items-count { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; font-weight: 700; }
    .cart-total-amount { font-size: 16px; font-weight: 800; }
    .view-cart-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .bottom-sheet {
      background: #fff;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp 0.25s ease;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 16px;
    }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; }
    .modal-content {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .cart-item-title { font-weight: 700; font-size: 13px; }
    .cart-item-sub { font-size: 11px; color: var(--text-muted); }

    /* Inputs */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #374151; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    .btn-submit:active { filter: brightness(0.95); }
    .btn-primary-action {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .empty-state { text-align: center; padding: 40px 10px; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-title">KBS Portal</div>
    <div class="search-box">
      <svg width="16" height="16" fill="none" stroke="#6b7280" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-4.35-4.35M16.65 11a5.65 5.65 0 11-11.3 0 5.65 5.65 0 0111.3 0z"/></svg>
      <input type="text" id="searchInput" placeholder="Search fittings, faucets, couplings..." />
    </div>
  </header>

  <!-- App Body: Left Sidebar + Products Grid -->
  <div class="app-body">
    <aside class="sidebar" id="sidebarNav"></aside>
    <main class="products-area" id="productsArea">
      <div class="category-header-title" id="activeCategoryTitle">Loading Catalogue...</div>
      <div class="product-grid" id="productGrid"></div>
    </main>
  </div>

  <!-- Floating Cart Bar -->
  <div class="cart-float-bar" id="cartBar" onclick="openCartModal()">
    <div class="cart-summary-txt">
      <span class="cart-items-count" id="barItemCount">0 ITEMS</span>
      <span class="cart-total-amount" id="barTotalAmount">₹0</span>
    </div>
    <div class="view-cart-btn">
      View Cart
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal-backdrop" id="cartModal">
    <div class="bottom-sheet">
      <div class="modal-header">
        <span>Cart Items (<span id="cartCountHeader">0</span>)</span>
        <button class="close-btn" onclick="closeCartModal()">✕</button>
      </div>
      <div class="modal-content" id="cartItemList"></div>
      <div style="padding: 14px; border-top: 1px solid var(--border);">
        <button class="btn-primary-action" onclick="openCheckoutModal()">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <!-- Checkout Details Modal -->
  <div class="modal-backdrop" id="checkoutModal">
    <div class="bottom-sheet">
      <div class="modal-header">
        <span>Dealer Information</span>
        <button class="close-btn" onclick="closeCheckoutModal()">✕</button>
      </div>
      <div class="modal-content">
        <form id="orderForm" onsubmit="submitWhatsAppOrder(event)">
          <div class="form-group">
            <label for="firmName">Firm / Shop Name *</label>
            <input type="text" id="firmName" placeholder="e.g. Goyal Sanitary Store" required />
          </div>
          <div class="form-group">
            <label for="phoneNumber">Mobile Number *</label>
            <input type="tel" id="phoneNumber" placeholder="e.g. 98290XXXXX" required />
          </div>
          <div class="form-group">
            <label for="transportName">Transport / Destination City *</label>
            <input type="text" id="transportName" placeholder="e.g. Jaipur Golden Transport / Sikar" required />
          </div>
          <div class="form-group">
            <label for="orderNotes">Remark / Notes (Optional)</label>
            <input type="text" id="orderNotes" placeholder="Any specific requirements or urgency" />
          </div>
          <button type="submit" class="btn-submit">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm.02 18.06c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.04 8.04 0 01-1.24-4.29c0-4.46 3.63-8.09 8.09-8.09 2.16 0 4.19.84 5.72 2.37 1.53 1.53 2.37 3.56 2.37 5.72 0 4.46-3.63 8.09-8.09 8.09zm4.44-6.07c-.24-.12-1.44-.71-1.66-.79-.23-.08-.39-.12-.55.12-.17.24-.63.79-.78.95-.14.16-.29.18-.53.06-.24-.12-1.02-.38-1.95-1.21-.72-.64-1.21-1.44-1.35-1.68-.14-.24-.02-.37.1-.49.11-.11.24-.29.36-.43.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.33-.76-1.82-.2-.48-.41-.41-.56-.42l-.48-.01c-.16 0-.42.06-.64.3-.22.24-.86.84-.86 2.05s.88 2.38 1 2.54c.12.16 1.73 2.64 4.19 3.7.59.25 1.05.4 1.41.51.59.19 1.13.16 1.56.1.48-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg>
            Send Order via WhatsApp
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1n7OQ4lg7S2BeeLX01t-L-sd9bcVvq8pgKyozZCmgEhg';
    const GID = '2073319162';
    const WHATSAPP_NUMBER = '917718861024';

    // Format drive images into fast thumbnails
    function formatDriveImage(url) {
      if (!url) return 'https://placehold.co/300x300/f3f4f6/9ca3af?text=KBS';
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600`;
      }
      return url;
    }

    // CSV Parse utility
    function parseCSV(text) {
      const rows = [];
      let row = [], entry = '', insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];
        if (char === '"') {
          if (insideQuote && nextChar === '"') { entry += '"'; i++; }
          else { insideQuote = !insideQuote; }
        } else if (char === ',' && !insideQuote) {
          row.push(entry.trim()); entry = '';
        } else if ((char === '\r' || char === '\n') && !insideQuote) {
          if (char === '\r' && nextChar === '\n') { i++; }
          row.push(entry.trim());
          if (row.some(c => c !== '')) rows.push(row);
          row = []; entry = '';
        } else {
          entry += char;
        }
      }
      if (entry || row.length) { row.push(entry.trim()); rows.push(row); }
      return rows;
    }

    // State
    let groupedProducts = []; // Array of product groups
    let categories = [];
    let selectedCategory = '';
    let cart = {}; // key: itemId, value: { item, qty }
    let selectedVariants = {}; // key: groupId, value: selectedItemId

    // Load Data
    async function loadCatalogue() {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
      try {
        const res = await fetch(gvizUrl);
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        processRows(rows);
      } catch (err) {
        console.error("Error fetching sheet:", err);
        document.getElementById('activeCategoryTitle').innerText = "Failed to load catalogue. Please check connection.";
      }
    }

    function processRows(rows) {
      if (rows.length < 2) return;
      const header = rows[0].map(h => h.trim().toLowerCase());
      const col = {
        group: header.indexOf('group id'),
        id: header.indexOf('item id'),
        category: header.indexOf('category'),
        name: header.indexOf('name'),
        varient: header.indexOf('varient'),
        material: header.indexOf('material'),
        rate: header.indexOf('rate'),
        image: header.indexOf('image')
      };

      const groupsMap = new Map();

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r[col.id] && !r[col.name]) continue;

        const groupId = r[col.group] || r[col.id] || `G-${i}`;
        const itemObj = {
          groupId: groupId,
          itemId: r[col.id] || '',
          category: r[col.category] || 'General',
          name: r[col.name] || 'Product',
          varient: r[col.varient] || 'Default',
          material: r[col.material] || '',
          rate: parseFloat(r[col.rate]) || 0,
          image: r[col.image] || ''
        };

        if (!groupsMap.has(groupId)) {
          groupsMap.set(groupId, {
            groupId: groupId,
            name: itemObj.name,
            category: itemObj.category,
            material: itemObj.material,
            image: itemObj.image,
            variants: [itemObj]
          });
        } else {
          const g = groupsMap.get(groupId);
          if (!g.image && itemObj.image) g.image = itemObj.image;
          g.variants.push(itemObj);
        }
      }

      groupedProducts = Array.from(groupsMap.values());

      // Init selected variant
      groupedProducts.forEach(g => {
        selectedVariants[g.groupId] = g.variants[0].itemId;
      });

      // Categories
      categories = [...new Set(groupedProducts.map(g => g.category.trim()))].filter(Boolean);
      selectedCategory = categories[0] || '';

      renderSidebar();
      renderProducts();
    }

    function renderSidebar() {
      const sidebar = document.getElementById('sidebarNav');
      sidebar.innerHTML = categories.map(cat => `
        <div class="cat-item ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">
          <div class="cat-icon-circle">${cat.substring(0, 2).toUpperCase()}</div>
          <span>${cat}</span>
        </div>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      document.getElementById('searchInput').value = '';
      renderSidebar();
      renderProducts();
    }

    function selectVariant(groupId, itemId) {
      selectedVariants[groupId] = itemId;
      renderCardFooter(groupId);
    }

    function renderProducts() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      let list = groupedProducts;

      if (query) {
        list = list.filter(g =>
          g.name.toLowerCase().includes(query) ||
          g.category.toLowerCase().includes(query) ||
          g.variants.some(v => v.itemId.toLowerCase().includes(query) || v.varient.toLowerCase().includes(query))
        );
        document.getElementById('activeCategoryTitle').innerText = `Search Results (${list.length})`;
      } else {
        list = list.filter(g => g.category === selectedCategory);
        document.getElementById('activeCategoryTitle').innerText = selectedCategory;
      }

      const grid = document.getElementById('productGrid');
      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state">No products found in this category.</div>';
        return;
      }

      grid.innerHTML = list.map(g => {
        const activeItemId = selectedVariants[g.groupId] || g.variants[0].itemId;
        const activeItem = g.variants.find(v => v.itemId === activeItemId) || g.variants[0];

        return `
          <div class="card" id="card-${g.groupId}">
            <div>
              <div class="img-wrap">
                <img src="${formatDriveImage(g.image)}" alt="${g.name}" loading="lazy" />
              </div>
              ${g.material ? `<span class="item-material">${g.material}</span>` : ''}
              <div class="item-name">${g.name}</div>

              <!-- Variant Chips -->
              <div class="variant-selector-wrap">
                ${g.variants.map(v => `
                  <div class="variant-chip ${v.itemId === activeItemId ? 'selected' : ''}"
                       onclick="changeVariant('${g.groupId}', '${v.itemId}')">
                    ${v.varient || v.itemId}
                  </div>
                `).join('')}
              </div>
            </div>

            <div id="footer-${g.groupId}">
              ${getFooterHtml(g, activeItem)}
            </div>
          </div>
        `;
      }).join('');
    }

    function getFooterHtml(g, item) {
      const qty = cart[item.itemId]?.qty || 0;
      return `
        <div class="card-footer">
          <div class="price-box">
            <span class="rate">${item.rate > 0 ? '₹' + item.rate : 'POA'}</span>
            <span class="item-code">${item.itemId}</span>
          </div>
          ${qty === 0 ? `
            <button class="btn-add" onclick="updateQty('${item.itemId}', 1)">+ ADD</button>
          ` : `
            <div class="qty-counter">
              <button onclick="updateQty('${item.itemId}', -1)">−</button>
              <span class="qty-val">${qty}</span>
              <button onclick="updateQty('${item.itemId}', 1)">+</button>
            </div>
          `}
        </div>
      `;
    }

    function changeVariant(groupId, itemId) {
      selectedVariants[groupId] = itemId;
      // Re-highlight chips
      const card = document.getElementById(`card-${groupId}`);
      if (!card) return;
      const chips = card.querySelectorAll('.variant-chip');
      const g = groupedProducts.find(x => x.groupId === groupId);
      chips.forEach((c, idx) => {
        if (g.variants[idx].itemId === itemId) c.classList.add('selected');
        else c.classList.remove('selected');
      });

      const activeItem = g.variants.find(v => v.itemId === itemId);
      document.getElementById(`footer-${groupId}`).innerHTML = getFooterHtml(g, activeItem);
    }

    function updateQty(itemId, delta) {
      // Find item
      let targetItem = null;
      let targetGroup = null;
      for (const g of groupedProducts) {
        const found = g.variants.find(v => v.itemId === itemId);
        if (found) { targetItem = found; targetGroup = g; break; }
      }
      if (!targetItem) return;

      const cur = (cart[itemId]?.qty || 0) + delta;
      if (cur <= 0) {
        delete cart[itemId];
      } else {
        cart[itemId] = { item: targetItem, qty: cur };
      }

      // Update UI
      if (targetGroup) {
        const activeItemId = selectedVariants[targetGroup.groupId];
        if (activeItemId === itemId) {
          const footer = document.getElementById(`footer-${targetGroup.groupId}`);
          if (footer) footer.innerHTML = getFooterHtml(targetGroup, targetItem);
        }
      }

      updateCartBar();
      renderCartItems();
    }

    function updateCartBar() {
      const items = Object.values(cart);
      const totalCount = items.reduce((sum, i) => sum + i.qty, 0);
      const totalAmount = items.reduce((sum, i) => sum + (i.qty * i.item.rate), 0);

      const bar = document.getElementById('cartBar');
      if (totalCount > 0) {
        bar.style.display = 'flex';
        document.getElementById('barItemCount').innerText = `${totalCount} ITEM${totalCount > 1 ? 'S' : ''}`;
        document.getElementById('barTotalAmount').innerText = totalAmount > 0 ? `₹${totalAmount.toLocaleString('en-IN')}` : 'Estimated';
      } else {
        bar.style.display = 'none';
      }
    }

    /* Cart Modal Controls */
    function openCartModal() {
      renderCartItems();
      document.getElementById('cartModal').classList.add('open');
    }
    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function renderCartItems() {
      const items = Object.values(cart);
      document.getElementById('cartCountHeader').innerText = items.reduce((sum, i) => sum + i.qty, 0);
      const container = document.getElementById('cartItemList');
      if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">Your order cart is empty.</div>';
        return;
      }
      container.innerHTML = items.map(({ item, qty }) => `
        <div class="cart-row">
          <div>
            <div class="cart-item-title">${item.name} (${item.varient})</div>
            <div class="cart-item-sub">Item Code: ${item.itemId} \vert{} Rate:${item.rate ? '₹' + item.rate : 'POA'}</div>
          </div>
          <div class="qty-counter">
            <button onclick="updateQty('${item.itemId}', -1)">−</button>
            <span class="qty-val">${qty}</span>
            <button onclick="updateQty('${item.itemId}', 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    /* Checkout & WhatsApp Dispatch */
    function openCheckoutModal() {
      if (Object.keys(cart).length === 0) return alert('Your cart is empty!');
      closeCartModal();
      document.getElementById('checkoutModal').classList.add('open');
    }
    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.remove('open');
    }

    function submitWhatsAppOrder(e) {
      e.preventDefault();
      const firm = document.getElementById('firmName').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();
      const transport = document.getElementById('transportName').value.trim();
      const notes = document.getElementById('orderNotes').value.trim();

      const items = Object.values(cart);
      if (items.length === 0) return alert('Your cart is empty!');

      let totalEst = 0;
      let orderListText = '';

      items.forEach((entry, idx) => {
        const itm = entry.item;
        const lineTotal = itm.rate * entry.qty;
        totalEst += lineTotal;
        orderListText += `${idx + 1}. *${itm.name}* (${itm.varient})\n   ↳ Code: ${itm.itemId} | Qty: *${entry.qty} pcs* ${itm.rate ? `| ₹${itm.rate}/pc = ₹${lineTotal}` : ''}\n`;
      });

      const message =
`*📦 NEW ORDER - KHANDELWAL BATH STUDIO*
━━━━━━━━━━━━━━━━━━━━
🏢 *Firm Name:* ${firm}
📞 *Contact:* ${phone}
🚚 *Transport / City:* ${transport}${notes ? `📝 *Note:* ${notes}\n` : ''}━━━━━━━━━━━━━━━━━━━━
*ORDER SUMMARY:*
${orderListText}━━━━━━━━━━━━━━━━━━━━
*Total Items:* ${items.reduce((s, x) => s + x.qty, 0)} pcs${totalEst > 0 ? `*Estimated Total:* ₹${totalEst.toLocaleString('en-IN')}` : ''}

Please confirm stock availability & dispatch.`;

      const encodedMsg = encodeURIComponent(message);
      const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMsg}`;

      // Open WhatsApp
      window.open(waUrl, '_blank');
      closeCheckoutModal();
    }

    // Search Listener
    document.getElementById('searchInput').addEventListener('input', () => {
      renderProducts();
    });

    // Start
    loadCatalogue();
  </script>
</body>
</html>
